<style>
        body {
            background-color: #fbf9f8; /* Soft Cream */
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito Sans', sans-serif;
        }
        .bento-card {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bento-card:active {
            transform: scale(0.95);
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.8s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .tactile-shadow {
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.08), 0 3px 0 0 rgba(0,0,0,0.05);
        }
        .press-depth-orange { box-shadow: 0 6px 0 0 #613100; }
        .press-depth-blue { box-shadow: 0 6px 0 0 #004d67; }
        .press-depth-green { box-shadow: 0 6px 0 0 #00480f; }
        .press-depth-amber { box-shadow: 0 6px 0 0 #8a7362; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background min-h-screen pb-32 overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim shadow-sm docked full-width top-0 z-50 sticky">
<div class="flex justify-between items-center w-full px-margin-mobile py-sm">
<div class="flex items-center gap-md">
<div class="relative w-12 h-12">
<svg class="w-full h-full" viewbox="0 0 36 36">
<path class="text-surface-variant stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-width="3"></path>
<path class="text-tertiary stroke-current progress-ring-circle" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-dasharray="65, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<div class="absolute inset-0 flex items-center justify-center p-1">
<img alt="Avatar" class="w-full h-full rounded-full bg-secondary-fixed" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsjsNVKSd2jW-slqjFC3fu3WBONsOaQ2vj15bRdthf5LntBkxRSZlSYm81pwn9LJFMWOtGgjiZhqpoiFAsc2ctC_JeGrr1mnXo4I3drKEiTNKSS2qMvvogHbNmSxffX8LziAOD9_wq4m5RFyCh6GMhh8LNzPOnUxJ0mXDTS0lBHP4ouXs_WIrj6Tdvndt0vE5Z6sp9IhfPGJJAbZJ3XabQtdO93syla35dTLoNR3QdRGcTdwCvhg8YGtn2vdl5iy6Jn-VOfP1BsN2R"/>
</div>
</div>
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-primary dark:text-primary-fixed-dim leading-tight">Welcome back, Chipo!</h1>
<p class="font-label-lg text-label-lg text-on-surface-variant">65% of today's goal</p>
</div>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<main class="px-margin-mobile pt-lg space-y-lg max-w-2xl mx-auto">
<!-- Interactive Hero/Bento Grid -->
<div class="grid grid-cols-2 gap-md">
<!-- 1. Learn Phonics (Large Feature) -->
<button class="col-span-2 relative overflow-hidden bento-card bg-primary-container p-lg rounded-[32px] text-left flex items-center justify-between group active:scale-95 press-depth-orange h-48 border-2 border-on-primary-container/10">
<div class="z-10">
<span class="bg-white/20 text-white font-bold px-sm py-xs rounded-full text-xs uppercase tracking-wider mb-sm inline-block">Daily Mission</span>
<h2 class="font-display-lg text-display-lg text-white mb-xs">Learn Phonics</h2>
<p class="font-body-md text-white/90">Master the letter 'A' sounds</p>
</div>
<div class="relative w-32 h-32 flex items-center justify-center bg-white/10 rounded-full rotate-12 group-hover:rotate-0 transition-transform duration-500">
<span class="text-[80px] font-phonics-focus text-white drop-shadow-lg">A</span>
</div>
</button>
<!-- 2. Story Library -->
<button class="col-span-1 bento-card bg-secondary-container p-md rounded-[32px] text-left flex flex-col justify-between press-depth-blue h-56 border-2 border-on-secondary-container/10">
<div class="w-14 h-14 bg-white/30 rounded-2xl flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-on-secondary-container text-4xl" data-icon="menu_book" data-weight="fill">menu_book</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg text-on-secondary-container leading-tight">Story Library</h3>
<p class="font-label-lg text-label-lg text-on-secondary-container/70">12 new books</p>
</div>
</button>
<!-- 3. Reading Challenges -->
<button class="col-span-1 bento-card bg-tertiary-container p-md rounded-[32px] text-left flex flex-col justify-between press-depth-green h-56 border-2 border-on-tertiary-container/10">
<div class="w-14 h-14 bg-white/30 rounded-2xl flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-on-tertiary-container text-4xl" data-icon="emoji_events" data-weight="fill">emoji_events</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg text-on-tertiary-container leading-tight">Reading Challenges</h3>
<p class="font-label-lg text-label-lg text-on-tertiary-container/70">Earn stars!</p>
</div>
</button>
<!-- 4. My Progress -->
<button class="col-span-2 bento-card bg-surface-container-high p-lg rounded-[32px] text-left flex items-center gap-lg press-depth-amber h-32 border-2 border-outline-variant/30">
<div class="w-20 h-20 bg-primary-fixed flex items-center justify-center rounded-2xl">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="bar_chart">bar_chart</span>
</div>
<div>
<h3 class="font-title-lg text-title-lg text-on-surface leading-tight">My Progress</h3>
<p class="font-body-md text-on-surface-variant">See how much you've learned!</p>
<div class="mt-sm h-2 w-48 bg-outline-variant rounded-full overflow-hidden">
<div class="bg-primary h-full w-[65%] rounded-full"></div>
</div>
</div>
<div class="ml-auto">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</div>
<!-- Recent Activity / Encouragement Section -->
<section class="bg-surface-container-low rounded-[32px] p-lg border border-outline-variant/20">
<h4 class="font-title-lg text-title-lg text-on-surface mb-md">Keep it up!</h4>
<div class="flex items-center gap-md">
<img class="w-20 h-20 rounded-2xl object-cover shadow-sm" data-alt="A bright and cheerful illustration of a friendly animated lion character reading a colorful book under a large leafy green tree. The art style is soft and tactile with rounded edges and vibrant saturated colors of orange, green, and blue, matching a child-friendly educational app aesthetic. The sunlight is warm and golden, creating a nurturing and safe atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJYjnj6GnzzWj_x2_JvUqZ5H-3U7hcUWdkNM2GRqNtsdfL9x8HO3Hj36rKO4cPI01YlXZvIcmhG2K5seTSfFetsF7IYj4NepH_D5ZRDQSSExNIYrz3e69Bd_nsvoMUCaDs_msvH2SP5UEo8CRfO35U7atlJ0EiYR9dXE5igPOtpIhhpzH1NGy1flo7GDwEbOLgo0HxWtp370Adoyiq1VIoWIfYnwbfaDpCuUTNBsJFNJRgVQvmLApP92V8b84jWYn5gL8q3nD1b4ar"/>
<div class="flex-1">
<p class="font-body-md text-on-surface leading-snug">"You're doing great with your 'Ba' and 'Ma' sounds today!"</p>
<span class="font-label-lg text-tertiary mt-xs inline-block">Continue Lesson 4 →</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface-container-low dark:bg-surface-container-lowest shadow-[0_-4px_8px_0_rgba(0,0,0,0.08)] rounded-t-xl">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-tertiary-container dark:bg-tertiary text-on-tertiary-container dark:text-on-tertiary rounded-full px-6 py-2 transition-all duration-200 active:scale-90">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill">home</span>
<span class="font-label-lg text-label-lg">Home</span>
</button>
<!-- Stories -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-secondary-container/50 dark:hover:bg-secondary-container/20 rounded-full transition-all duration-200 active:scale-90">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-label-lg text-label-lg">Stories</span>
</button>
<!-- Progress -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-secondary-container/50 dark:hover:bg-secondary-container/20 rounded-full transition-all duration-200 active:scale-90">
<span class="material-symbols-outlined" data-icon="star">star</span>
<span class="font-label-lg text-label-lg">Progress</span>
</button>
<!-- Settings -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:bg-secondary-container/50 dark:hover:bg-secondary-container/20 rounded-full transition-all duration-200 active:scale-90">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-lg text-label-lg">Settings</span>
</button>
</nav>
<script>
        // Simple micro-interaction for cards
        document.querySelectorAll('.bento-card').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.96) translateY(2px)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1) translateY(0px)';
            });
        });
    </script>
</body></html>
