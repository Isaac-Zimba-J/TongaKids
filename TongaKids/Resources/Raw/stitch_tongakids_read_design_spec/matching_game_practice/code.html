<style>

<script>
        function selectCard(element) {
            // Remove selection from all cards
            document.querySelectorAll('.phonics-card').forEach(card => {
                card.classList.remove('selected', 'glow-active', 'border-4', 'border-tertiary');
                card.classList.add('border-b-[6px]');
                // Re-add color specific borders if needed or let CSS handle it
            });

            // Add selection to clicked card
            element.classList.add('selected', 'glow-active', 'border-4', 'border-tertiary');
            element.classList.remove('border-b-[6px]');

            // Haptic-like feedback (Visual)
            element.style.transform = "scale(1.08)";
            setTimeout(() => {
                element.style.transform = "scale(1.05)";
            }, 150);
        }

        // Simple audio simulation
        document.getElementById('audio-trigger').addEventListener('click', function() {
            const btn = this;
            btn.classList.add('bg-tertiary');
            setTimeout(() => {
                btn.classList.remove('bg-tertiary');
            }, 500);
            
            // In a real app, this would play "BA" sound
            console.log("Playing sound: BA");
        });

        // Submit logic
        document.getElementById('submit-btn').addEventListener('click', function() {
            const selected = document.querySelector('.phonics-card.selected');
            if(selected && selected.innerText.includes('BA')) {
                // Success Interaction
                confettiEffect();
                this.innerHTML = 'Correct! <span class="material-symbols-outlined">celebration</span>';
                this.classList.replace('bg-primary', 'bg-tertiary');
            } else {
                // Shake effect for wrong answer
                const container = document.querySelector('.grid');
                container.classList.add('animate-shake');
                setTimeout(() => container.classList.remove('animate-shake'), 500);
            }
        });

        function confettiEffect() {
            // Simple visual cue for success
            const body = document.body;
            for(let i=0; i<20; i++) {
                const conf = document.createElement('div');
                conf.className = 'absolute w-3 h-3 rounded-full z-50';
                conf.style.backgroundColor = ['#ff8a00', '#5abd5c', '#58cafe'][Math.floor(Math.random()*3)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                body.appendChild(conf);
                
                const anim = conf.animate([
                    { transform: 'translateY(0) rotate(0)', opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random()*360}deg)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 2000,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });
                anim.onfinish = () => conf.remove();
            }
        }
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .animate-shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
            animation-iteration-count: 2;
        }
