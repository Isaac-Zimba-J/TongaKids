<style>
        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #fbf9f8;
            overflow: hidden;
        }
        .splash-gradient {
            background: linear-gradient(180deg, #ff8a00 0%, #fff8e7 100%);
        }
        .bounce-gentle {
            animation: bounce-gentle 3s infinite ease-in-out;
        }
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .progress-loader {
            width: 140px;
            height: 6px;
            background-color: rgba(145, 76, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-loader::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background-color: #914c00;
            border-radius: 10px;
            animation: loading 2s infinite ease-in-out;
        }
        @keyframes loading {
            0% { left: -40%; }
            100% { left: 100%; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="flex flex-col min-h-screen splash-gradient">

</div>
</div>

                TongaKids Read

            Loading Adventures...
        </p>

<!-- Interactive Layer: Particles / Sparkles (Vanilla JS) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.body;
            const colors = ['#ff8a00', '#5abd5c', '#58cafe', '#ffb77f'];

            function createSparkle() {
                const sparkle = document.createElement('div');
                const size = Math.random() * 8 + 4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                sparkle.style.position = 'fixed';
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.backgroundColor = color;
                sparkle.style.borderRadius = '50%';
                sparkle.style.pointerEvents = 'none';
                sparkle.style.zIndex = '5';
                sparkle.style.opacity = '0.6';
                
                const startX = Math.random() * window.innerWidth;
                const startY = window.innerHeight + 10;
                
                sparkle.style.left = `${startX}px`;
                sparkle.style.top = `${startY}px`;
                
                container.appendChild(sparkle);
                
                const animation = sparkle.animate([
                    { transform: 'translateY(0) scale(1)', opacity: 0.6 },
                    { transform: `translateY(-${window.innerHeight + 100}px) translateX(${(Math.random() - 0.5) * 100}px) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 3000 + 4000,
                    easing: 'linear'
                });
                
                animation.onfinish = () => sparkle.remove();
            }

            setInterval(createSparkle, 300);

            // Micro-interaction on logo
            const logo = document.querySelector('h1');
            logo.addEventListener('mouseenter', () => {
                logo.classList.add('scale-105', 'transition-transform');
            });
            logo.addEventListener('mouseleave', () => {
                logo.classList.remove('scale-105');
            });
        });
    </script>
