<script>
        // Micro-interactions for profile selection
        document.querySelectorAll('.group').forEach(profile => {
            profile.addEventListener('click', () => {
                // Visual feedback for selection
                profile.classList.add('ring-4', 'ring-primary', 'rounded-xl', 'p-2');
                setTimeout(() => {
                    // Simulation of navigation or selection
                    alert('Logging in as ' + profile.querySelector('span').innerText + '!');
                }, 400);
            });
        });
    </script>
