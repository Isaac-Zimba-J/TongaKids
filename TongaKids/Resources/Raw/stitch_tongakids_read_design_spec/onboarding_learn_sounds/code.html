<!-- Atmospheric Particles Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.body;
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'absolute pointer-events-none rounded-full';
                const size = Math.random() * 8 + 4;
                const colors = ['bg-primary-container/20', 'bg-secondary-container/20', 'bg-tertiary-container/20'];
                
                particle.classList.add(colors[Math.floor(Math.random() * colors.length)]);
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                container.appendChild(particle);
                
                animateParticle(particle);
            }

            function animateParticle(el) {
                const duration = Math.random() * 5000 + 3000;
                const tx = (Math.random() - 0.5) * 100;
                const ty = (Math.random() - 0.5) * 100;
                
                el.animate([
                    { transform: 'translate(0, 0)', opacity: 0.3 },
                    { transform: `translate(${tx}px, ${ty}px)`, opacity: 0.7 },
                    { transform: 'translate(0, 0)', opacity: 0.3 }
                ], {
                    duration: duration,
                    iterations: Infinity,
                    easing: 'linear'
                });
            }
        });
    </script>
