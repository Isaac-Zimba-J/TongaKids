<script>
        // Simple Micro-interaction for Audio Button
        const audioBtn = document.getElementById('audio-btn');
        const icon = audioBtn.querySelector('.material-symbols-outlined');

        audioBtn.addEventListener('click', () => {
            // Visual feedback
            icon.classList.add('scale-125');
            audioBtn.classList.add('glow-effect');
            
            // Simulate audio play
            setTimeout(() => {
                icon.classList.remove('scale-125');
                audioBtn.classList.remove('glow-effect');
            }, 500);

            // In a real app, this would trigger: new Audio('path/to/ba_sound.mp3').play();

        });
